[package]
name = "lazydcompose"
version = "0.1.0"
description = "An example generated using the event-driven-async template"
authors = ["elias"]
license = "MIT"
edition = "2024"

[dependencies]
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.31"
ratatui = "0.30.0"
tokio = { version = "1.40.0", features = ["full"] }
color-eyre = "0.6.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
async-stream = "0.3.6"
tokio-stream = "0.1.17"
directories = "6.0.0"
lazy_static = "1.5.0"
tracing = "0.1.44"
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
async-trait = "0.1.89"
itertools = "0.14.0"
regex = "1.12.2"
textwrap = "0.16.2"
signal-hook = "0.4.1"

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[[bin]]
name = "lazydcompose"
test = false
bench = false
